<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="./icon-512.png" />
    <title>Simple Design Doc</title>
    <script type="importmap">
      {
        "imports": {
          "@microsoft/power-apps/data": "./power-apps-data.js"
        }
      }
    </script>
    <style>
      :root {
        --bg: #f5f6f8;
        --panel: #ffffff;
        --sidebar: #1f2430;
        --sidebar-2: #2a3142;
        --text: #1f2430;
        --text-dim: #6b7280;
        --text-inv: #e5e7eb;
        --accent: #5b6cff;
        --accent-2: #4453d9;
        --border: #e3e5ea;
        --danger: #e5484d;
        --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 12px rgba(0,0,0,.06);
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: var(--text); background: var(--bg); overflow: hidden;
      }
      #root { height: 100vh; display: grid; grid-template-columns: 240px 220px 1fr; grid-template-rows: 48px 1fr; grid-template-areas: "topbar topbar topbar" "sidebar palette canvas"; }

      /* Top bar */
      .topbar { grid-area: topbar; background: var(--sidebar); color: var(--text-inv); display: flex; align-items: center; padding: 0 14px; gap: 10px; border-bottom: 1px solid #0f1320; }
      .topbar .brand { font-weight: 600; letter-spacing: .2px; margin-right: 14px; }
      .topbar .doc-title { background: transparent; border: 1px solid #3a4256; color: var(--text-inv); padding: 6px 10px; border-radius: 6px; width: 280px; font-size: 13px; }
      .topbar .doc-title:focus { outline: none; border-color: var(--accent); }
      .topbar .spacer { flex: 1; }
      .topbar button { background: var(--sidebar-2); color: var(--text-inv); border: 1px solid #3a4256; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }
      .topbar button:hover { background: #38415a; }
      .topbar button.primary { background: var(--accent); border-color: var(--accent); }
      .topbar button.primary:hover { background: var(--accent-2); }
      .topbar button.danger { background: transparent; border-color: #5a2a2e; color: #f7a1a4; }
      .topbar button.danger:hover { background: #3a1a1d; }
      .topbar .status { font-size: 11px; color: #9aa3b8; min-width: 90px; text-align: right; }

      /* Sidebar — doc list */
      .sidebar { grid-area: sidebar; background: var(--sidebar); color: var(--text-inv); border-right: 1px solid #0f1320; display: flex; flex-direction: column; overflow: hidden; }
      .sidebar h3 { margin: 14px 14px 8px; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #9aa3b8; font-weight: 600; }
      .doc-list { flex: 1; overflow-y: auto; padding: 0 8px 8px; }
      .doc-item { padding: 8px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; color: #cdd3e1; display: flex; justify-content: space-between; align-items: center; gap: 6px; }
      .doc-item:hover { background: var(--sidebar-2); }
      .doc-item.active { background: var(--accent); color: white; }
      .doc-item .doc-del { opacity: 0; background: transparent; border: 0; color: inherit; cursor: pointer; font-size: 14px; padding: 0 4px; }
      .doc-item:hover .doc-del { opacity: .8; }
      .doc-item .doc-del:hover { opacity: 1; color: #ffb4b6; }
      .sidebar .new-btn { margin: 8px 14px 14px; padding: 8px; background: var(--accent); color: white; border: 0; border-radius: 6px; cursor: pointer; font-weight: 600; }
      .sidebar .new-btn:hover { background: var(--accent-2); }

      /* Palette */
      .palette { grid-area: palette; background: var(--panel); border-right: 1px solid var(--border); overflow-y: auto; padding: 12px; }
      .palette h3 { margin: 4px 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim); font-weight: 600; }
      .tool-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 14px; }
      .tool-btn { aspect-ratio: 1; background: #f0f1f5; border: 1px solid var(--border); border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text); font-size: 11px; }
      .tool-btn:hover { background: #e6e8ee; }
      .tool-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
      .tool-btn svg { width: 18px; height: 18px; }
      .img-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
      .img-thumb { aspect-ratio: 1; background: #f0f1f5; border: 1px solid var(--border); border-radius: 6px; padding: 4px; cursor: grab; display: flex; align-items: center; justify-content: center; overflow: hidden; }
      .img-thumb img { max-width: 100%; max-height: 100%; pointer-events: none; }
      .img-thumb:active { cursor: grabbing; }
      .upload-btn { display: block; width: 100%; margin-top: 10px; padding: 8px; background: #f0f1f5; border: 1px dashed #b8bdcb; border-radius: 6px; cursor: pointer; text-align: center; color: var(--text-dim); font-size: 12px; }
      .upload-btn:hover { border-color: var(--accent); color: var(--accent); }

      /* Canvas area */
      .canvas-wrap { grid-area: canvas; position: relative; overflow: hidden; background: var(--bg); }
      .canvas-wrap svg { display: block; width: 100%; height: 100%; background:
        linear-gradient(var(--border) 1px, transparent 1px) 0 0 / 20px 20px,
        linear-gradient(90deg, var(--border) 1px, transparent 1px) 0 0 / 20px 20px,
        var(--panel);
      }
      .canvas-wrap svg.tool-rect, .canvas-wrap svg.tool-oval, .canvas-wrap svg.tool-line, .canvas-wrap svg.tool-freehand, .canvas-wrap svg.tool-text { cursor: crosshair; }
      .canvas-wrap svg.arrow-pending { cursor: cell; }

      /* Style toolbar (floating top of canvas) */
      .style-bar { position: absolute; top: 12px; left: 12px; right: 12px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow); padding: 8px 12px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; font-size: 12px; pointer-events: auto; z-index: 5; }
      .style-bar label { display: inline-flex; align-items: center; gap: 6px; color: var(--text-dim); }
      .style-bar input[type=color] { width: 28px; height: 24px; border: 1px solid var(--border); border-radius: 4px; padding: 0; background: white; cursor: pointer; }
      .style-bar input[type=color]:disabled { opacity: .45; cursor: not-allowed; }
      .style-bar input[type=number] { width: 56px; padding: 4px 6px; border: 1px solid var(--border); border-radius: 4px; font-size: 12px; }
      .style-bar input[type=checkbox] { margin: 0; }
      .style-bar .sep { width: 1px; align-self: stretch; background: var(--border); }
      .style-bar .del-btn { margin-left: auto; background: transparent; border: 1px solid var(--border); color: var(--danger); border-radius: 4px; padding: 4px 10px; cursor: pointer; font-size: 12px; }
      .style-bar .del-btn:hover { background: #fef2f3; }

      /* Inspector (bottom right) */
      .inspector { position: absolute; bottom: 12px; right: 12px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow); padding: 10px 12px; display: flex; gap: 10px; align-items: center; font-size: 12px; z-index: 5; }
      .inspector .field { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
      .inspector .field label { color: var(--text-dim); font-size: 10px; text-transform: uppercase; letter-spacing: .5px; }
      .inspector input { width: 60px; padding: 4px 6px; border: 1px solid var(--border); border-radius: 4px; font-size: 12px; }
      .inspector.hidden { display: none; }

      /* Hint */
      .hint { position: absolute; bottom: 12px; left: 12px; color: var(--text-dim); font-size: 11px; background: rgba(255,255,255,.7); padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border); pointer-events: none; }

      /* Selection */
      .sel-box { fill: none; stroke: var(--accent); stroke-width: 1; stroke-dasharray: 4 3; pointer-events: none; }
      .sel-handle { fill: white; stroke: var(--accent); stroke-width: 1.5; cursor: nwse-resize; }
      .sel-handle.n, .sel-handle.s { cursor: ns-resize; }
      .sel-handle.e, .sel-handle.w { cursor: ew-resize; }
      .sel-handle.ne, .sel-handle.sw { cursor: nesw-resize; }

      /* Text editor overlay */
      .text-edit { position: absolute; border: 1px solid var(--accent); background: white; padding: 2px 4px; font-family: inherit; outline: none; z-index: 6; }

      /* Toast */
      .toast { position: absolute; top: 60px; left: 50%; transform: translateX(-50%); background: var(--sidebar); color: white; padding: 8px 14px; border-radius: 6px; font-size: 12px; box-shadow: var(--shadow); z-index: 10; opacity: 0; transition: opacity .2s; pointer-events: none; }
      .toast.show { opacity: 1; }
      .toast.error { background: var(--danger); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="index.js"></script>
  </body>
</html>
